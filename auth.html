
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F1E9">
    <title>Connexion - FridgeChef</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F5F1E9;
            color: #342D27;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            font-family: Georgia, serif;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #81776D;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #E5DED3;
            border-radius: 10px;
            background: #FFFEFC;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #8A765E;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #81776D;
        }

        .switch a {
            color: #8A765E;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>FridgeChef</h1>

    <p class="subtitle" id="subtitle">
        Bienvenue ! Connectez-vous.
    </p>

    <form id="authForm">

        <div id="nameField" class="hidden">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" placeholder="Votre prénom">
        </div>

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required placeholder="exemple@email.com">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" required
               minlength="6" placeholder="Votre mot de passe">

        <button type="submit" id="submitButton">
            Se connecter
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="switch">
        <span id="switchText">Pas encore de compte ?</span>
        <a id="switchButton">Créer un compte</a>
    </p>

</div>

<script type="module">

import { supabase } from "./supabase.js";

const form = document.getElementById("authForm");
const nameField = document.getElementById("nameField");
const prenom = document.getElementById("prenom");
const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const switchButton = document.getElementById("switchButton");

let isRegister = false;

// Vérifier si l'utilisateur est déjà connecté
async function checkSession() {
    const { data, error } = await supabase.auth.getSession();

    if (error) {
        console.error("Erreur session :", error);
        return;
    }

    if (data.session) {
        window.location.replace("./index.html");
    }
}

checkSession();

// Changer entre connexion et inscription
switchButton.addEventListener("click", () => {

    isRegister = !isRegister;

    nameField.classList.toggle("hidden", !isRegister);
    prenom.required = isRegister;

    submitButton.textContent = isRegister
        ? "Créer mon compte"
        : "Se connecter";

    document.getElementById("subtitle").textContent =
        isRegister
            ? "Créez votre compte FridgeChef."
            : "Bienvenue ! Connectez-vous.";

    document.getElementById("switchText").textContent =
        isRegister ? "Déjà un compte ?" : "Pas encore de compte ?";

    switchButton.textContent =
        isRegister ? "Se connecter" : "Créer un compte";

    message.textContent = "";
});

// Connexion et inscription
form.addEventListener("submit", async (e) => {

    e.preventDefault();

    message.textContent = "Veuillez patienter...";
    submitButton.disabled = true;

    try {

        if (isRegister) {

            const { data, error } = await supabase.auth.signUp({
                email: email.value.trim(),
                password: password.value,
                options: {
                    emailRedirectTo:
                        "https://angelina-blondet.github.io/fridgechef/",
                    data: {
                        first_name: prenom.value.trim()
                    }
                }
            });

            if (error) throw error;

            if (!data.session) {
                message.textContent =
                    "Compte créé ! Vérifiez votre boîte mail pour confirmer votre adresse.";
                return;
            }

        } else {

            const { data, error } =
                await supabase.auth.signInWithPassword({
                    email: email.value.trim(),
                    password: password.value
                });

            if (error) throw error;

            if (!data.session) {
                throw new Error("La connexion n'a pas créé de session.");
            }

            // Vérifier que la session est bien enregistrée
            const { data: sessionData, error: sessionError } =
                await supabase.auth.getSession();

            if (sessionError) throw sessionError;

            if (!sessionData.session) {
                throw new Error(
                    "La session n'a pas été enregistrée."
                );
            }

        }

        message.textContent = "Connexion réussie ! Ouverture de FridgeChef...";

        window.location.replace("./index.html");

    } catch (error) {

        console.error("Erreur FridgeChef :", error);

        message.textContent = error.message ||
            "Une erreur est survenue.";

    } finally {

        submitButton.disabled = false;

    }

});

</script>

</body>
</html>
